// ==================== buildscript 引入 ForgeGradle ====================
buildscript {
	repositories {
		maven { url = 'https://maven.minecraftforge.net' }
		maven { url = 'https://maven.aliyun.com/repository/public' }
		maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
		maven { url = "https://maven.lirxowo.com/releases" }
		mavenCentral()
		mavenLocal()
	}
	dependencies {
		classpath group: "net.minecraftforge.gradle", name: "ForgeGradle", version: "6.0.24"
		classpath "org.spongepowered:mixingradle:0.7-SNAPSHOT"
	}
}

// ==================== 应用插件 ====================
plugins {
	id "eclipse"
	id "idea"
	id "maven-publish"
	id "net.minecraftforge.gradle" version "[6.0.24]"
	id "org.parchmentmc.librarian.forgegradle" version "1.+"
}

// ==================== 打印信息 ====================
println "=== Gradle JVM: ${System.getProperty("java.home")} ==="
println "=== Java Version: ${System.getProperty("java.version")} ==="


// ==================== 基本信息 ====================
version = mod_version
group = mod_group_id

base {
	archivesName = "VoidThings"
}

// ==================== Java 环境 ====================
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

// ==================== Minecraft 配置 ====================
minecraft {
	// mappings channel: "parchment", version: "2023.09.03-1.20.1"
	mappings channel: mapping_channel, version: mapping_version
	copyIdeResources = true
	runs {
		configureEach {
			workingDirectory project.file("run")
			property "forge.logging.markers", "REGISTRIES"
			property "forge.logging.console.level", "debug"

			mods {
				"${mod_id}" {
					source sourceSets.main
				}
			}
		}

		client {
			property "forge.enabledGameTestNamespaces", mod_id
		}

		server {
			property "forge.enabledGameTestNamespaces", mod_id
			args "--nogui"
		}

		data {
			workingDirectory project.file("run-data")
			args "--mod", mod_id, "--all", "--output", file("src/generated/resources/"), "--existing", file("src/main/resources/")
		}
	}
}

reobf {
	jarJar {}
}

jarJar.enable()

sourceSets.main.resources {
	srcDir "src/generated/resources"
}

tasks.jarJar.configure {
	archiveClassifier.set("")
}

tasks.jar.configure {
	archiveClassifier.set("slim")
}

sourceSets.main.resources {
	srcDir "src/generated/resources"
}

// mixin {
//	add sourceSets.main, "${mod_id}.refmap.json"
//	config "${mod_id}.mixins.json"
// }

// ==================== 仓库配置 ====================
repositories {
	mavenCentral()
	maven {
		url = "https://modmaven.dev/"
	}
	maven {
		name = "Tterrag Maven"
		url = "https://maven.tterrag.com/"
	}
	maven {
		name = "LowDragMC-Ldlib"
		url = "https://maven.firstdarkdev.xyz/snapshots"
	}
	maven {
		name = "公开 阿里云国内镜像"
		url = "https://maven.aliyun.com/repository/public"
	}
	maven {
		name = "中心 阿里云国内镜像"
		url = "https://maven.aliyun.com/repository/central"
	}
	maven {
		name = "Gradel 插件 阿里云国内镜像"
		url = "https://maven.aliyun.com/repository/gradle-plugin"
	}
	maven {
		name = "Illusive Soulworks maven"
		url = "https://maven.theillusivec4.top/"
	}
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
	}
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/maven"
		content {
			includeGroup "maven.modrinth"
		}
	}
	maven {
		name "DVS1 Maven FS"
		url "https://dvs1.progwml6.com/files/maven"
	}
	maven {
		url = "https://maven.minecraftforge.net"
	}
	maven {
		url = "https://maven.firstdark.dev/snapshots"
	}
	maven {
		name = "RC 这招太狠了"
		url = "https://maven.lirxowo.com/releases"
	}
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
	maven {
		name = "GeckoLib"
		url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
		content {
			includeGroupByRegex("software\\.bernie.*")
			includeGroup("com.eliotlash.mclib")
		}
	}
	maven {
		name = "reposiliteRepositoryReleases"
		url = uri("https://maven.lirxowo.com/releases")
	}
	maven {
		url = "https://maven.createmod.net"
	}
	maven {
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		url = "https://maven.architectury.dev/"
		name = "Architectury"
	}
	maven {
		url = "https://maven.latvian.dev/releases"
		name = "Latvian Mods (KubeJS, Rhino)"
	}
}

// ==================== 依赖配置 ====================
dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	// JEI
	compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
	compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
	runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

	// Nebula Libs
	implementation("dev.celestiacraft:nebula_libs:${nebula_lib_version}:dev") { transitive = false }
	jarJar(group: "dev.celestiacraft", name: "nebula_libs", version: "[${nebula_lib_version}]") { transitive = false }

	// Registrate
	implementation fg.deobf("com.tterrag.registrate:Registrate:MC1.20-1.3.3")
}

// ==================== 资源处理 ====================
tasks.named("processResources", ProcessResources).configure {
	def replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			forge_version          : forge_version,
			forge_version_range    : forge_version_range,
			loader_version_range   : loader_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description,
	]
	inputs.properties replaceProperties

	filesMatching(["META-INF/mods.toml", "pack.mcmeta"]) {
		expand replaceProperties + [project: project]
	}
}

// ==================== JAR 打包 ====================
tasks.named("jar", Jar).configure {
	manifest {
		attributes([
				"Specification-Title"     : mod_id,
				"Specification-Vendor"    : mod_authors,
				"Specification-Version"   : "1",
				"Implementation-Title"    : project.name,
				"Implementation-Version"  : project.jar.archiveVersion,
				"Implementation-Vendor"   : mod_authors,
				"Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
	finalizedBy "reobfJar"
}

// ==================== 编译编码 ====================
tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.compilerArgs << "-parameters"
}